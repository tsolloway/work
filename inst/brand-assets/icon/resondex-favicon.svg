<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Resondex">
  <!-- Favicon — single node + two short edges. The simplified member of the
       mark family; reads cleanly down to ~24px. -->
  <g stroke="#595959" stroke-width="2.6" stroke-opacity="0.45" stroke-linecap="round">
    <line x1="30" y1="28" x2="52" y2="14"/>
    <line x1="30" y1="36" x2="52" y2="50"/>
  </g>
  <circle cx="52" cy="14" r="4" fill="#5C8A6B"/>
  <circle cx="52" cy="50" r="4" fill="#C2773C"/>
  <circle cx="27" cy="32" r="12" fill="#5B7E92"/>
</svg>
