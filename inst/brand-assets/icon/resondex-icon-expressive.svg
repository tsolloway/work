<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Resondex">
  <!-- Expressive icon — the canonical 4-colour mark expanded to a full
       network: same four distinct corner satellites, plus four info-blue
       cardinal nodes radiating N/E/S/W. The large-canvas / hero member of
       the family (decks, covers, big tiles); the plain mark is this minus
       the cardinal ring. -->
  <g stroke="#595959" stroke-width="2.2" stroke-opacity="0.4" stroke-linecap="round">
    <line x1="32" y1="32" x2="15" y2="15"/>
    <line x1="32" y1="32" x2="49" y2="16"/>
    <line x1="32" y1="32" x2="15" y2="49"/>
    <line x1="32" y1="32" x2="49" y2="48"/>
    <line x1="32" y1="32" x2="32" y2="11"/>
    <line x1="32" y1="32" x2="53" y2="32"/>
    <line x1="32" y1="32" x2="32" y2="53"/>
    <line x1="32" y1="32" x2="11" y2="32"/>
  </g>
  <circle cx="32" cy="11" r="3.2" fill="#5B7E92"/>
  <circle cx="53" cy="32" r="3.2" fill="#5B7E92"/>
  <circle cx="32" cy="53" r="3.2" fill="#5B7E92"/>
  <circle cx="11" cy="32" r="3.2" fill="#5B7E92"/>
  <circle cx="15" cy="15" r="4.5" fill="#5C8A6B"/>
  <circle cx="49" cy="16" r="4.5" fill="#C2773C"/>
  <circle cx="15" cy="49" r="4.5" fill="#AC6258"/>
  <circle cx="49" cy="48" r="4.5" fill="#595959"/>
  <circle cx="32" cy="32" r="8.5" fill="#5B7E92"/>
</svg>
