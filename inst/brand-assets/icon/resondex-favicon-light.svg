<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Resondex">
  <!-- Light favicon (C from _favicon-preview.html) — off-white tile + the
       4-corner mark in full colour. For contexts that prefer a softer,
       more editorial favicon over the bold slate tile. -->
