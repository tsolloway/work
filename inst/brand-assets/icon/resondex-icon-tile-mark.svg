<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Resondex">
  <!-- Tile-with-mark icon — slate rounded-square background (matches
       icon-tile.svg) with the canonical 4-corner mark in white on top.
       Bolder filled-tile presence for square contexts (PWA icon, app stores,
       social avatars) while still using the real brand mark instead of an
       "R" monogram. -->
  <rect width="64" height="64" rx="15" fill="#5B7E92"/>
  <g transform="translate(32 32) scale(0.7) translate(-32 -32)">
    <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.65" stroke-linecap="round">
      <line x1="32" y1="32" x2="15" y2="15"/>
      <line x1="32" y1="32" x2="49" y2="16"/>
      <line x1="32" y1="32" x2="15" y2="49"/>
      <line x1="32" y1="32" x2="49" y2="48"/>
    </g>
    <circle cx="15" cy="15" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="49" cy="16" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="15" cy="49" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="49" cy="48" r="4.5" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="32" cy="32" r="8.5" fill="#ffffff"/>
  </g>
</svg>
