<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Resondex">
  <!-- V5 · Graded depth — slate tile with three filled circles in graded
       opacity. No rings/gaps, just stacked translucent fills converging on
       a solid center. Subtler than the bordered rings; more atmospheric. -->
  <rect width="64" height="64" rx="15" fill="#5B7E92"/>
  <circle cx="32" cy="32" r="24" fill="#ffffff" fill-opacity="0.18"/>
  <circle cx="32" cy="32" r="16" fill="#ffffff" fill-opacity="0.35"/>
  <circle cx="32" cy="32" r="8"  fill="#ffffff"/>
</svg>
