<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Resondex">
  <!-- Primary favicon (B from _favicon-preview.html) — slate rounded-tile
       background + the 4-corner mark in white. Bold filled tile reads
       clean on light and dark chrome at every size from 16 to 128 px. -->
  <rect width="64" height="64" rx="14" fill="#5B7E92"/>
  <g stroke="#ffffff" stroke-width="3" stroke-opacity="0.9" stroke-linecap="round">
    <line x1="32" y1="32" x2="19" y2="19"/>
    <line x1="32" y1="32" x2="45" y2="19"/>
    <line x1="32" y1="32" x2="19" y2="45"/>
    <line x1="32" y1="32" x2="45" y2="45"/>
  </g>
  <circle cx="19" cy="19" r="5" fill="#ffffff"/>
  <circle cx="45" cy="19" r="5" fill="#ffffff"/>
  <circle cx="19" cy="45" r="5" fill="#ffffff"/>
  <circle cx="45" cy="45" r="5" fill="#ffffff"/>
  <circle cx="32" cy="32" r="9.5" fill="#ffffff"/>
</svg>
