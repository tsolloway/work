<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-label="Resondex — Data made decisive.">
  <!-- LinkedIn PERSONAL PROFILE banner — 1584×396 (~4:1).
       Mirrors the company banner's clean design at personal scale:
       no network art (the profile photo carries identity); dot-anchored
       lockup; all three lines align at x=480.
       Mobile-safe: text lives well inside LinkedIn's center ~67% crop
       (visible x ≈ 261–1322), and stays in the upper-middle band so the
       profile photo's bottom-left overlap never crashes the type. -->
  <rect width="1584" height="396" fill="#f6f6f4"/>

  <!-- All three lines align at x=480. The dot sits ON the alignment line
       (left edge at x=480); the wordmark trails it. -->

  <!-- Header lockup — solid 14px dot + "Resondex" in Inter 600. -->
  <circle cx="487" cy="50" r="7" fill="#1a1d1f"/>
  <text x="511" y="61" font-family="Inter, sans-serif" font-weight="600"
        font-size="30" letter-spacing="-0.5" fill="#1a1d1f">Resondex</text>

  <!-- Headline: Inter Bold + Instrument Serif italic accent, same
       treatment as the OG, company banner, and website hero. -->
  <text x="480" y="180" font-family="Inter, sans-serif" font-weight="700"
        font-size="100" letter-spacing="-2.8" fill="#1a1d1f">Data made <tspan
        font-family="'Instrument Serif', Georgia, serif" font-weight="400"
        font-style="italic" font-size="110" fill="#5B7E92" dx="3">decisive.</tspan></text>

  <!-- Sub-line — the canonical brand promise. -->
  <text x="480" y="230" font-family="Inter, sans-serif" font-weight="500"
        font-size="30" fill="#6c757d">Turn data into clarity you can act on.</text>
</svg>
