<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Resondex — Data made decisive.">
  <!-- Open Graph share card (1200×630) for og:image / twitter:image.
       Aurora backdrop matches the website hero: warm cream base + soft
       radial washes (info top-left, success bottom-right, warning centre,
       danger bottom-left). Same defs as the LinkedIn banners; percentage
       centres scale cleanly to any viewBox. -->
  <defs>
    <radialGradient id="auroraInfo" cx="15%" cy="25%" r="55%">
      <stop offset="0%"  stop-color="#5B7E92" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#5B7E92" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraSuccess" cx="85%" cy="80%" r="55%">
      <stop offset="0%"  stop-color="#5C8A6B" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#5C8A6B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraWarning" cx="60%" cy="40%" r="40%">
      <stop offset="0%"  stop-color="#C2773C" stop-opacity="0.20"/>
      <stop offset="70%" stop-color="#C2773C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraDanger" cx="25%" cy="85%" r="45%">
      <stop offset="0%"  stop-color="#AC6258" stop-opacity="0.18"/>
      <stop offset="70%" stop-color="#AC6258" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#f6f6f4"/>
  <rect width="1200" height="630" fill="url(#auroraInfo)"/>
  <rect width="1200" height="630" fill="url(#auroraSuccess)"/>
  <rect width="1200" height="630" fill="url(#auroraWarning)"/>
  <rect width="1200" height="630" fill="url(#auroraDanger)"/>

  <!-- Hero network (same geometry as the canonical OG). -->
  <g transform="translate(651 131) scale(0.92)">
    <g stroke="#595959" stroke-width="1.8" stroke-opacity="0.3" stroke-linecap="round">
      <line x1="100" y1="100" x2="200" y2="200"/>
      <line x1="300" y1="100" x2="200" y2="200"/>
      <line x1="100" y1="300" x2="200" y2="200"/>
      <line x1="300" y1="300" x2="200" y2="200"/>
      <line x1="200" y1="80"  x2="200" y2="200"/>
      <line x1="200" y1="320" x2="200" y2="200"/>
      <line x1="80"  y1="200" x2="200" y2="200"/>
      <line x1="320" y1="200" x2="200" y2="200"/>
      <line x1="100" y1="100" x2="300" y2="100"/>
      <line x1="100" y1="300" x2="300" y2="300"/>
    </g>
    <circle cx="100" cy="100" r="14" fill="#5C8A6B"/>
    <circle cx="300" cy="100" r="14" fill="#5C8A6B"/>
    <circle cx="100" cy="300" r="14" fill="#C2773C"/>
    <circle cx="300" cy="300" r="14" fill="#C2773C"/>
    <circle cx="200" cy="80"  r="11" fill="#AC6258"/>
    <circle cx="200" cy="320" r="11" fill="#AC6258"/>
    <circle cx="80"  cy="200" r="11" fill="#5B7E92"/>
    <circle cx="320" cy="200" r="11" fill="#5B7E92"/>
    <circle cx="200" cy="200" r="24" fill="#5B7E92"/>
  </g>

  <!-- Wordmark lockup, top-left -->
  <g transform="translate(90 88)">
    <circle cx="14" cy="28" r="13" fill="#1a1d1f"/>
    <text x="38" y="44" font-family="Inter, sans-serif" font-weight="600" font-size="44" letter-spacing="-1" fill="#1a1d1f">Resondex</text>
  </g>

  <!-- Headline -->
  <text x="90" y="330" font-family="Inter, sans-serif" font-weight="700" font-size="92" letter-spacing="-2.5" fill="#1a1d1f">Data made</text>
  <text x="90" y="438" font-family="'Instrument Serif', Georgia, serif" font-style="italic" font-size="100" letter-spacing="-1" fill="#5B7E92">decisive.</text>

  <!-- Sub-tagline -->
  <text x="92" y="516" font-family="Inter, sans-serif" font-weight="500" font-size="36" fill="#6c757d">Turn data into clarity you can act on.</text>
</svg>
