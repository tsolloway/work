<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="Resondex">
  <!-- Square social avatar, 1000×1000. Mark centered on the warm brand bg
       with generous padding so it survives a circular crop (Twitter/X,
       LinkedIn, etc.). Use resondex-icon-tile.svg instead if you want the
       bolder filled-slate monogram look. -->
  <rect width="1000" height="1000" fill="#f6f6f4"/>
  <g transform="translate(310 310) scale(6.06)">
    <g stroke="#595959" stroke-width="2.2" stroke-opacity="0.4" stroke-linecap="round">
      <line x1="32" y1="32" x2="15" y2="15"/>
      <line x1="32" y1="32" x2="49" y2="16"/>
      <line x1="32" y1="32" x2="15" y2="49"/>
      <line x1="32" y1="32" x2="49" y2="48"/>
    </g>
    <circle cx="15" cy="15" r="4.5" fill="#5C8A6B"/>
    <circle cx="49" cy="16" r="4.5" fill="#C2773C"/>
    <circle cx="15" cy="49" r="4.5" fill="#AC6258"/>
    <circle cx="49" cy="48" r="4.5" fill="#595959"/>
    <circle cx="32" cy="32" r="8.5" fill="#5B7E92"/>
  </g>
</svg>
