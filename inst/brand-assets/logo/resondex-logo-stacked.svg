<svg xmlns="http://www.w3.org/2000/svg" width="180" height="100" viewBox="0 0 180 100" role="img" aria-label="Resondex">
  <!-- Stacked lockup — mark centered above the wordmark. For square-ish
       placements (cards, slides). Text uses live Inter; outline for vendors.
       Geometry: mark bottom ≈ y=54, wordmark baseline y=88 (cap top ≈ y=66),
       gap ≈ 12u so the lockup reads tight at any size. -->

  <g transform="translate(58 0)">
    <g stroke="#595959" stroke-width="2.2" stroke-opacity="0.4" stroke-linecap="round">
      <line x1="32" y1="32" x2="15" y2="15"/>
      <line x1="32" y1="32" x2="49" y2="16"/>
      <line x1="32" y1="32" x2="15" y2="49"/>
      <line x1="32" y1="32" x2="49" y2="48"/>
    </g>
    <circle cx="15" cy="15" r="4.5" fill="#5C8A6B"/>
    <circle cx="49" cy="16" r="4.5" fill="#C2773C"/>
    <circle cx="15" cy="49" r="4.5" fill="#AC6258"/>
    <circle cx="49" cy="48" r="4.5" fill="#595959"/>
    <circle cx="32" cy="32" r="8.5" fill="#5B7E92"/>
  </g>
  <text x="90" y="88" text-anchor="middle"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="600" font-size="30" letter-spacing="-0.7" fill="#1a1d1f">Resondex</text>
</svg>
