<svg xmlns="http://www.w3.org/2000/svg" width="280" height="64" viewBox="0 0 280 64" role="img" aria-label="Resondex">
  <!-- Primary horizontal lockup — mark + wordmark (light backgrounds).
       Text uses live Inter; outline to paths for external vendors. -->
  <g>
    <g stroke="#595959" stroke-width="2.2" stroke-opacity="0.4" stroke-linecap="round">
      <line x1="32" y1="32" x2="15" y2="15"/>
      <line x1="32" y1="32" x2="49" y2="16"/>
      <line x1="32" y1="32" x2="15" y2="49"/>
      <line x1="32" y1="32" x2="49" y2="48"/>
    </g>
    <circle cx="15" cy="15" r="4.5" fill="#5C8A6B"/>
    <circle cx="49" cy="16" r="4.5" fill="#C2773C"/>
    <circle cx="15" cy="49" r="4.5" fill="#AC6258"/>
    <circle cx="49" cy="48" r="4.5" fill="#595959"/>
    <circle cx="32" cy="32" r="8.5" fill="#5B7E92"/>
  </g>
  <text x="80" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-weight="600" font-size="32" letter-spacing="-0.8" fill="#1a1d1f">Resondex</text>
</svg>
