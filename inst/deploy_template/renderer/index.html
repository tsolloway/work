<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Launcher</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ===== Library View ===== -->
  <div id="library-view">
    <header>
      <h1 id="header-title">App Launcher</h1>
      <p id="header-subtitle" class="subtitle">Load and run Shiny apps</p>
    </header>

    <main>
      <div id="app-grid" class="app-grid"></div>
    </main>

    <div id="empty-state" class="empty-state" style="display: none;">
      <div class="empty-icon">+</div>
      <h2>No apps loaded yet</h2>
      <p>Drag an app file here or click the button below</p>
      <button id="empty-add-btn" class="btn btn-primary">Add App</button>
    </div>

    <button id="fab-add" class="fab" title="Add App" style="display: none;">+</button>
  </div>

  <!-- ===== App View (iframe) ===== -->
  <div id="app-view" style="display: none;">
    <div id="app-bar">
      <button id="back-btn" class="btn btn-secondary">&larr; Back to Library</button>
      <span id="app-bar-title"></span>
    </div>
    <div id="loading-overlay">
      <div class="loading-spinner"></div>
      <p class="loading-text">Loading</p>
    </div>
    <iframe id="app-frame"></iframe>
  </div>

  <!-- ===== Drop Overlay ===== -->
  <div id="drop-overlay">
    <div class="drop-overlay-content">
      <div class="drop-overlay-icon">+</div>
      <p>Drop to add app</p>
    </div>
  </div>

  <!-- ===== Rename Modal ===== -->
  <div id="rename-modal" class="modal" style="display: none;">
    <div class="modal-content">
      <h3>Rename App</h3>
      <input type="text" id="rename-input" class="input" placeholder="App name">
      <div class="modal-actions">
        <button id="rename-cancel" class="btn btn-secondary">Cancel</button>
        <button id="rename-save" class="btn btn-primary">Save</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
